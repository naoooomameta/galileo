<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img" aria-label="ガリレオ 毎日課題ロードマップ サンプル（イメージ）">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EDF5F0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14614A"/>
      <stop offset="1" stop-color="#0E4A38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A843"/>
      <stop offset="1" stop-color="#C49A3C"/>
    </linearGradient>
  </defs>

  <rect width="900" height="506" fill="url(#bg)"/>

  <!-- header -->
  <text x="48" y="60" font-family="'Noto Serif JP',serif" font-size="26" font-weight="700" fill="#0A3228">毎日課題ロードマップ（サンプル）</text>
  <text x="48" y="88" font-family="'Noto Sans JP',sans-serif" font-size="14" fill="#6a8a78">志望校：東京理科大学 工学部 ／ 現状偏差値 → 合格ライン まで</text>
  <rect x="700" y="40" width="152" height="34" rx="17" fill="#0E4A38"/>
  <text x="776" y="62" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="700" fill="#fff">残り 11ヶ月</text>

  <!-- timeline baseline -->
  <line x1="70" y1="190" x2="830" y2="190" stroke="#c0d8c8" stroke-width="3"/>
  <!-- progress -->
  <line x1="70" y1="190" x2="520" y2="190" stroke="url(#bar)" stroke-width="6" stroke-linecap="round"/>

  <!-- milestones -->
  <g font-family="'Noto Sans JP',sans-serif">
    <!-- m1 -->
    <circle cx="120" cy="190" r="14" fill="#0E4A38"/>
    <text x="120" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0A3228">基礎固め</text>
    <text x="120" y="222" text-anchor="middle" font-size="12" fill="#6a8a78">4〜6月</text>
    <!-- m2 -->
    <circle cx="320" cy="190" r="14" fill="#14614A"/>
    <text x="320" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0A3228">標準演習</text>
    <text x="320" y="222" text-anchor="middle" font-size="12" fill="#6a8a78">7〜9月</text>
    <!-- m3 (current) -->
    <circle cx="520" cy="190" r="18" fill="#C49A3C"/>
    <text x="520" y="196" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">今</text>
    <text x="520" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#0A3228">過去問・応用</text>
    <text x="520" y="226" text-anchor="middle" font-size="12" fill="#6a8a78">10〜12月</text>
    <!-- m4 -->
    <circle cx="720" cy="190" r="14" fill="#c0d8c8"/>
    <text x="720" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0A3228">直前仕上げ</text>
    <text x="720" y="222" text-anchor="middle" font-size="12" fill="#6a8a78">1〜2月</text>
    <!-- goal -->
    <rect x="804" y="176" width="28" height="28" rx="6" fill="url(#gold)"/>
    <text x="818" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">★</text>
    <text x="818" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#0A3228">合格</text>
  </g>

  <!-- daily task cards -->
  <g font-family="'Noto Sans JP',sans-serif">
    <text x="48" y="300" font-size="15" font-weight="700" fill="#0A3228">今週の毎日課題（例）</text>

    <rect x="48" y="318" width="250" height="150" rx="12" fill="#fff" stroke="#c0d8c8"/>
    <rect x="48" y="318" width="250" height="6" rx="3" fill="url(#bar)"/>
    <text x="68" y="352" font-size="14" font-weight="700" fill="#0E4A38">数学 IIIC</text>
    <text x="68" y="380" font-size="12.5" fill="#3a5a4a">・微分の計算ノート 10問</text>
    <text x="68" y="404" font-size="12.5" fill="#3a5a4a">・場合分けを先に記述</text>
    <text x="68" y="428" font-size="12.5" fill="#3a5a4a">・解き直し → 写真提出</text>
    <text x="68" y="452" font-size="12" fill="#6a8a78">所要：60分／日</text>

    <rect x="325" y="318" width="250" height="150" rx="12" fill="#fff" stroke="#c0d8c8"/>
    <rect x="325" y="318" width="250" height="6" rx="3" fill="url(#bar)"/>
    <text x="345" y="352" font-size="14" font-weight="700" fill="#0E4A38">物理</text>
    <text x="345" y="380" font-size="12.5" fill="#3a5a4a">・力学 基本問題 8問</text>
    <text x="345" y="404" font-size="12.5" fill="#3a5a4a">・向きを決めてから立式</text>
    <text x="345" y="428" font-size="12.5" fill="#3a5a4a">・誤答ノートにまとめ</text>
    <text x="345" y="452" font-size="12" fill="#6a8a78">所要：45分／日</text>

    <rect x="602" y="318" width="250" height="150" rx="12" fill="#fff" stroke="#c0d8c8"/>
    <rect x="602" y="318" width="250" height="6" rx="3" fill="url(#gold)"/>
    <text x="622" y="352" font-size="14" font-weight="700" fill="#0E4A38">化学</text>
    <text x="622" y="380" font-size="12.5" fill="#3a5a4a">・理論化学 確認テスト</text>
    <text x="622" y="404" font-size="12.5" fill="#3a5a4a">・「変わる/変わらない」整理</text>
    <text x="622" y="428" font-size="12.5" fill="#3a5a4a">・暗記事項 10個</text>
    <text x="622" y="452" font-size="12" fill="#6a8a78">所要：40分／日</text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="505" fill="none" stroke="#c0d8c8" stroke-opacity="0.6"/>
</svg>
