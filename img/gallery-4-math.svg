<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg4" x1="800" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCEEE3"/><stop offset="100%" stop-color="#EDF5F0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <!-- Whiteboard -->
  <rect x="100" y="60" width="600" height="400" rx="12" fill="#fff" stroke="#c0d8c8" stroke-width="2"/>
  <!-- Board frame top -->
  <rect x="100" y="60" width="600" height="40" rx="12" fill="#0E4A38" opacity=".08"/>
  <!-- Math content -->
  <g fill="#0E4A38" font-family="serif" opacity=".7">
    <text x="140" y="140" font-size="20" font-weight="700" fill="#C49A3C" opacity="1">【微分積分】</text>
    <text x="140" y="180" font-size="18">定義: f'(x) = lim  f(x+h) - f(x)</text>
    <text x="380" y="200" font-size="18">h→0      h</text>
    <text x="140" y="250" font-size="18">例題: f(x) = x³ + 2x² - 5x + 1</text>
    <text x="140" y="290" font-size="18">f'(x) = 3x² + 4x - 5</text>
    <text x="140" y="340" font-size="16" fill="#C49A3C" opacity="1">Point: 各項のべき乗を係数に掛けて</text>
    <text x="140" y="365" font-size="16" fill="#C49A3C" opacity="1">       指数を1つ下げる</text>
  </g>
  <!-- Pointer/marker -->
  <rect x="580" y="300" width="8" height="50" rx="4" fill="#C49A3C" opacity=".6" transform="rotate(-30 584 325)"/>
  <!-- Eraser -->
  <rect x="620" y="380" width="50" height="30" rx="4" fill="#c0d8c8" opacity=".5"/>
  <!-- Graph sketch -->
  <g transform="translate(460,130)" opacity=".5">
    <rect width="200" height="150" rx="4" fill="none" stroke="#c0d8c8" stroke-width="1"/>
    <line x1="30" y1="120" x2="180" y2="120" stroke="#0E4A38" stroke-width="1.5"/>
    <line x1="30" y1="20" x2="30" y2="120" stroke="#0E4A38" stroke-width="1.5"/>
    <path d="M40 100 Q70 110 100 75 Q130 40 170 30" stroke="#C49A3C" stroke-width="2" fill="none"/>
    <text x="185" y="125" fill="#0E4A38" font-size="10" font-family="serif">x</text>
    <text x="20" y="18" fill="#0E4A38" font-size="10" font-family="serif">y</text>
  </g>
  <!-- Label -->
  <rect x="280" y="500" width="240" height="44" rx="22" fill="#0E4A38"/>
  <text x="400" y="527" text-anchor="middle" fill="#fff" font-size="16" font-family="sans-serif" font-weight="600">数学の解説中</text>
</svg>
