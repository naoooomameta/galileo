    <line x1="408" y1="414" x2="456" y2="414"/><line x1="408" y1="421" x2="456" y2="421"/><line x1="408" y1="428" x2="450" y2="428"/>
  </g>
  <path d="M414,418 l4,4 l9,-9" stroke="#C49A3C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
