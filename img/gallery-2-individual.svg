      <path d="M-41,-2 C-39,-42 -16,-54 0,-54 C16,-54 39,-42 41,-2 C27,-30 14,-34 0,-34 C-14,-34 -27,-30 -41,-2 Z" fill="#0E4A38"/>
    
  </g>
