<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F8F4"/><stop offset="55%" stop-color="#E4F1E9"/><stop offset="100%" stop-color="#D6EADD"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A843"/><stop offset="55%" stop-color="#C49A3C"/><stop offset="100%" stop-color="#B07E2A"/>
    </linearGradient>
    <linearGradient id="screen2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c6b51"/><stop offset="100%" stop-color="#0E4A38"/>
    </linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#F4F9F6"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
