    <path d="M0,-8 v5 M-6,-5 l3,4 M6,-5 l-3,4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <text x="420" y="143" text-anchor="middle" fill="#0E4A38" font-size="16" font-family="sans-serif" font-weight="700">1対1でじっくり</text>
  
  <g filter="url(#pillS)">
    <rect x="266" y="516" width="268" height="50" rx="25" fill="#0E4A38"/>
  </g>
  <rect x="266" y="516" width="268" height="50" rx="25" fill="none" stroke="#D4A843" stroke-opacity=".4" stroke-width="1.5"/>
  <circle cx="292" cy="541" r="3.4" fill="#D4A843"/>
  <text x="406" y="547" text-anchor="middle" fill="#fff" font-size="17" font-family="sans-serif" font-weight="700" letter-spacing=".02em">個別指導の様子</text>
