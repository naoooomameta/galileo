<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg6" x1="400" y1="0" x2="400" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCEEE3"/><stop offset="100%" stop-color="#EDF5F0"/>
    </linearGradient>
    <linearGradient id="gold6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C49A3C"/><stop offset="100%" stop-color="#D4A843"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg6)"/>
  <!-- Confetti -->
  <g opacity=".3">
    <rect x="120" y="80" width="12" height="12" rx="2" fill="#C49A3C" transform="rotate(30 126 86)"/>
    <rect x="250" y="50" width="10" height="10" rx="2" fill="#0E4A38" transform="rotate(-20 255 55)"/>
    <rect x="500" y="70" width="14" height="8" rx="2" fill="#C49A3C" transform="rotate(45 507 74)"/>
    <rect x="650" y="90" width="10" height="10" rx="2" fill="#14614A" transform="rotate(15 655 95)"/>
    <rect x="180" y="150" width="8" height="12" rx="2" fill="#14614A" transform="rotate(-35 184 156)"/>
    <rect x="620" y="140" width="12" height="8" rx="2" fill="#C49A3C" transform="rotate(25 626 144)"/>
    <circle cx="350" cy="60" r="5" fill="#C49A3C"/><circle cx="700" cy="120" r="4" fill="#0E4A38"/>
    <circle cx="150" cy="120" r="4" fill="#14614A"/><circle cx="450" cy="40" r="6" fill="#0E4A38"/>
  </g>
  <!-- Cherry blossom petals -->
  <g opacity=".2">
    <ellipse cx="100" cy="200" rx="8" ry="14" fill="#e8a0b0" transform="rotate(-30 100 200)"/>
    <ellipse cx="700" cy="180" rx="6" ry="12" fill="#e8a0b0" transform="rotate(20 700 180)"/>
    <ellipse cx="300" cy="100" rx="7" ry="13" fill="#e8a0b0" transform="rotate(40 300 100)"/>
  </g>
  <!-- Central badge -->
  <circle cx="400" cy="240" r="100" fill="url(#gold6)" opacity=".15" stroke="#C49A3C" stroke-width="2" stroke-opacity=".4"/>
  <circle cx="400" cy="240" r="80" fill="url(#gold6)" opacity=".1" stroke="#C49A3C" stroke-width="1.5" stroke-opacity=".3"/>
  <text x="400" y="225" text-anchor="middle" fill="#C49A3C" font-size="20" font-family="sans-serif" font-weight="700" opacity=".8">合 格</text>
  <text x="400" y="260" text-anchor="middle" fill="#0E4A38" font-size="16" font-family="serif" font-weight="700" opacity=".6">おめでとう！</text>
  <!-- University names -->
  <g font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="180" y="360" width="160" height="36" rx="18" fill="#0E4A38" opacity=".1" stroke="#0E4A38" stroke-width="1" stroke-opacity=".2"/>
    <text x="260" y="383" fill="#0E4A38" opacity=".6">東京大学 理科一類</text>
    <rect x="360" y="360" width="160" height="36" rx="18" fill="#0E4A38" opacity=".1" stroke="#0E4A38" stroke-width="1" stroke-opacity=".2"/>
    <text x="440" y="383" fill="#0E4A38" opacity=".6">京都大学 工学部</text>
    <rect x="540" y="360" width="130" height="36" rx="18" fill="#0E4A38" opacity=".1" stroke="#0E4A38" stroke-width="1" stroke-opacity=".2"/>
    <text x="605" y="383" fill="#0E4A38" opacity=".6">東京工業大学</text>
    <rect x="230" y="410" width="160" height="36" rx="18" fill="#C49A3C" opacity=".08" stroke="#C49A3C" stroke-width="1" stroke-opacity=".2"/>
    <text x="310" y="433" fill="#C49A3C" opacity=".6">早稲田大学 理工</text>
    <rect x="410" y="410" width="160" height="36" rx="18" fill="#C49A3C" opacity=".08" stroke="#C49A3C" stroke-width="1" stroke-opacity=".2"/>
    <text x="490" y="433" fill="#C49A3C" opacity=".6">慶應義塾大学 理工</text>
  </g>
  <!-- Label -->
  <rect x="270" y="490" width="260" height="44" rx="22" fill="#0E4A38"/>
  <text x="400" y="517" text-anchor="middle" fill="#fff" font-size="16" font-family="sans-serif" font-weight="600">合格発表の瞬間</text>
</svg>
