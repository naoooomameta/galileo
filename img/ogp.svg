<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E4A38"/><stop offset="100%" stop-color="#0A3228"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#obg)"/>
  <!-- Subtle pattern -->
  <g opacity=".03" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Gold accent line -->
  <rect x="0" y="0" width="1200" height="6" fill="#C49A3C" opacity=".6"/>
  <!-- Logo area -->
  <circle cx="600" cy="180" r="60" fill="none" stroke="#C49A3C" stroke-width="2" opacity=".4"/>
  <circle cx="600" cy="180" r="50" fill="#C49A3C" opacity=".08"/>
  <text x="600" y="195" text-anchor="middle" fill="#C49A3C" font-size="36" font-family="serif" font-weight="700" opacity=".8">G</text>
  <!-- Title -->
  <text x="600" y="300" text-anchor="middle" fill="#fff" font-size="48" font-family="serif" font-weight="700" letter-spacing="0.05em">ガリレオ</text>
  <text x="600" y="350" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="22" font-family="sans-serif" letter-spacing="0.1em">理系の大学受験専門塾</text>
  <!-- Tagline -->
  <rect x="350" y="390" width="500" height="50" rx="25" fill="rgba(196,154,60,.1)" stroke="rgba(196,154,60,.3)" stroke-width="1"/>
  <text x="600" y="421" text-anchor="middle" fill="#C49A3C" font-size="18" font-family="sans-serif" font-weight="600">毎日課題 × 理系思考で志望校合格へ。</text>
  <!-- Bottom badges -->
  <g font-family="sans-serif" font-size="14" text-anchor="middle">
    <rect x="250" y="480" width="140" height="32" rx="16" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
    <text x="320" y="501" fill="rgba(255,255,255,.6)">全国対応</text>
    <rect x="420" y="480" width="160" height="32" rx="16" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
    <text x="500" y="501" fill="rgba(255,255,255,.6)">マンツーマン</text>
    <rect x="610" y="480" width="180" height="32" rx="16" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
    <text x="700" y="501" fill="rgba(255,255,255,.6)">毎日課題システム</text>
    <rect x="820" y="480" width="160" height="32" rx="16" fill="rgba(196,154,60,.12)" stroke="rgba(196,154,60,.25)" stroke-width="1"/>
    <text x="900" y="501" fill="#C49A3C">無料体験受付中</text>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="rgba(0,0,0,.15)"/>
  <text x="600" y="602" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="14" font-family="sans-serif">東大・京大・東工大・旧帝大・早慶理工・医学部 合格実績</text>
</svg>
