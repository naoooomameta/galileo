  <rect x="192" y="146" width="246" height="190" rx="10" fill="#0E4A38" stroke="#2f8e6c" stroke-opacity=".45" stroke-width="1.5"/>
  <clipPath id="t1"><rect x="192" y="146" width="246" height="190" rx="10"/></clipPath>
  <g clip-path="url(#t1)">
  <g transform="translate(300,230) scale(0.62) rotate(0)">
    <!-- torso -->
    <path d="M-86,180 C-86,96 -48,60 0,60 C48,60 86,96 86,180 Z" fill="#2f8e6c"/>
    <!-- collar / neckline -->
    <path d="M-25,62 Q0,86 25,62 L22,76 Q0,98 -22,76 Z" fill="#4c9e81"/>
    <!-- neck -->
    <path d="M-14,24 h28 v16 q0,12 -14,12 q-14,0 -14,-12 z" fill="#2b8363"/>
