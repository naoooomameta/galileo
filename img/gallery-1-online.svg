<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EDF5F0"/><stop offset="100%" stop-color="#DCEEE3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <!-- Monitor -->
  <rect x="200" y="100" width="400" height="260" rx="12" fill="#0E4A38"/>
  <rect x="215" y="115" width="370" height="220" rx="6" fill="#1a5a44"/>
  <!-- Video grid on screen -->
  <rect x="225" y="125" width="170" height="100" rx="4" fill="#14614A" stroke="#2a7a5a" stroke-width="1"/>
  <circle cx="310" y="165" r="20" fill="#2a7a5a"/><ellipse cx="310" cy="200" rx="30" ry="15" fill="#2a7a5a"/>
  <rect x="405" y="125" width="170" height="100" rx="4" fill="#14614A" stroke="#2a7a5a" stroke-width="1"/>
  <circle cx="490" cy="165" r="20" fill="#2a7a5a"/><ellipse cx="490" cy="200" rx="30" ry="15" fill="#2a7a5a"/>
  <!-- Chat area -->
  <rect x="225" y="235" width="350" height="90" rx="4" fill="rgba(255,255,255,.05)"/>
  <rect x="235" y="245" width="200" height="16" rx="3" fill="rgba(255,255,255,.1)"/>
  <rect x="235" y="270" width="160" height="16" rx="3" fill="rgba(196,154,60,.15)"/>
  <rect x="235" y="295" width="180" height="16" rx="3" fill="rgba(255,255,255,.1)"/>
  <!-- Stand -->
  <rect x="370" y="360" width="60" height="40" fill="#c0d8c8"/>
  <rect x="310" y="395" width="180" height="12" rx="6" fill="#c0d8c8"/>
  <!-- Label -->
  <rect x="280" y="460" width="240" height="44" rx="22" fill="#0E4A38"/>
  <text x="400" y="487" text-anchor="middle" fill="#fff" font-size="16" font-family="sans-serif" font-weight="600">オンライン指導の様子</text>
</svg>
