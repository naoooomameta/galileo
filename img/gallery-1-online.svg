    <path d="M-39,-6 C-37,-41 -15,-52 0,-52 C15,-52 37,-41 39,-6 C27,-31 14,-35 0,-35 C-14,-35 -27,-31 -39,-6 Z" fill="#0E4A38"/>
    
    <g stroke="#C49A3C" stroke-width="3.2" fill="none" stroke-linejoin="round">
      <rect x="-27" y="-11" width="21" height="17" rx="6"/>
      <rect x="6" y="-11" width="21" height="17" rx="6"/>
      <path d="M-6,-4 q6,-4 12,0"/>
      <path d="M-27,-6 l-7,3"/><path d="M27,-6 l7,3"/>
    </g>
  </g></g>
  <!-- LIVE badge -->
  <rect x="204" y="158" width="120" height="26" rx="13" fill="url(#gold1)"/>
  <circle cx="220" cy="171" r="4.5" fill="#fff"/>
  <text x="234" y="175" fill="#fff" font-size="13" font-family="sans-serif" font-weight="700">LIVE 数学III</text>
  <!-- teacher name chip -->
  <rect x="204" y="306" width="118" height="22" rx="11" fill="#0A3228" opacity=".66"/>
  <text x="214" y="321" fill="#fff" font-size="12" font-family="sans-serif" font-weight="600">講師 — 田中</text>
  <!-- student tile -->
  <rect x="450" y="146" width="158" height="120" rx="9" fill="#0E4A38" stroke="#2f8e6c" stroke-opacity=".4" stroke-width="1.2"/>
  <clipPath id="s1"><rect x="450" y="146" width="158" height="120" rx="9"/></clipPath>
  <g clip-path="url(#s1)">
  <g transform="translate(536,226) scale(0.42) rotate(0)">
    <!-- torso -->
    <path d="M-86,180 C-86,96 -48,60 0,60 C48,60 86,96 86,180 Z" fill="#3a9b78"/>
    <!-- collar / neckline -->
    <path d="M-25,62 Q0,86 25,62 L22,76 Q0,98 -22,76 Z" fill="#56a98b"/>
    <!-- neck -->
    <path d="M-14,24 h28 v16 q0,12 -14,12 q-14,0 -14,-12 z" fill="#358f6e"/>
    <!-- head -->
    <circle cx="0" cy="0" r="40" fill="#3a9b78"/>
    <!-- under-chin shade -->
    <ellipse cx="0" cy="38" rx="15" ry="7" fill="#33886a" opacity=".5"/>
    
      <path d="M-41,-4 C-50,22 -45,46 -33,56 L-22,50 C-31,34 -30,8 -25,-10 Z" fill="#14614A"/>
      <path d="M41,-4 C50,22 45,46 33,56 L22,50 C31,34 30,8 25,-10 Z" fill="#14614A"/>
      <path d="M-41,-2 C-39,-42 -16,-54 0,-54 C16,-54 39,-42 41,-2 C27,-30 14,-34 0,-34 C-14,-34 -27,-30 -41,-2 Z" fill="#14614A"/>
    
  </g></g>
  <rect x="458" y="244" width="64" height="18" rx="9" fill="#0A3228" opacity=".6"/>
  <text x="466" y="257" fill="#fff" font-size="10.5" font-family="sans-serif" font-weight="600">生徒</text>
  <!-- side panel: shared note / formula -->
  <rect x="450" y="276" width="158" height="60" rx="8" fill="#ffffff" opacity=".07"/>
  <text x="462" y="296" fill="#D4A843" font-size="12" font-family="serif">∫ x² dx = x³/3 + C</text>
  <rect x="462" y="305" width="120" height="6" rx="3" fill="#ffffff" opacity=".14"/>
  <rect x="462" y="317" width="92" height="6" rx="3" fill="#D4A843" opacity=".4"/>
  <!-- call control bar -->
  <rect x="300" y="352" width="200" height="34" rx="17" fill="#ffffff" opacity=".08"/>
  <circle cx="332" cy="369" r="11" fill="#ffffff" opacity=".18"/>
  <circle cx="368" cy="369" r="11" fill="#ffffff" opacity=".18"/>
  <circle cx="404" cy="369" r="11" fill="#ffffff" opacity=".18"/>
  <circle cx="448" cy="369" r="13" fill="url(#gold1)"/>
  <path d="M442,369 h12 M448,363 v12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <!-- hinge -->
  <path d="M150,422 h500 q14,0 12,12 l-2,8 q-2,8 -12,8 H152 q-10,0 -12,-8 l-2,-8 q-2,-12 12,-12 Z" fill="#0c3a2b" stroke="#2f8e6c" stroke-opacity=".4" stroke-width="1.2"/>
  <!-- props: pen + cup -->
  <g filter="url(#soft21)">
    <rect x="690" y="370" width="44" height="40" rx="7" fill="#fff"/>
  </g>
  <path d="M734,380 q16,0 16,13 q0,13 -16,13" stroke="#c0d8c8" stroke-width="3" fill="none"/>
  <ellipse cx="712" cy="370" rx="22" ry="5" fill="#c0d8c8" opacity=".5"/>
  <path d="M704 360 q8,-12 16,0" stroke="#c0d8c8" stroke-width="2" fill="none" opacity=".6"/>
  <rect x="86" y="392" width="70" height="20" rx="6" fill="#D4A843" transform="rotate(-12 121 402)"/>
  <rect x="146" y="388" width="14" height="20" rx="3" fill="#0E4A38" transform="rotate(-12 153 398)"/>
  
  <g filter="url(#pillS)">
    <rect x="266" y="516" width="268" height="50" rx="25" fill="#0E4A38"/>
  </g>
  <rect x="266" y="516" width="268" height="50" rx="25" fill="none" stroke="#D4A843" stroke-opacity=".4" stroke-width="1.5"/>
  <circle cx="292" cy="541" r="3.4" fill="#D4A843"/>
  <text x="406" y="547" text-anchor="middle" fill="#fff" font-size="17" font-family="sans-serif" font-weight="700" letter-spacing=".02em">オンライン指導の様子</text>
</svg>
